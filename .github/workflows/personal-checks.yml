name: Personal Edition checks

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test --test-concurrency=2 --import ./tests/setup-env.mjs tests/*.test.mjs
      - run: git diff --check
